version: 2

models:
  - name: stg_kaggle_attendance
    description: "Weekly attendance from Kaggle (2000-2019): the crowd at each game the team played that week, home or away. Bye weeks dropped."
    columns:
      - name: attendance_key
        description: "Primary key: team_year_week"
        tests:
          - unique
          - not_null
      
      - name: weekly_attendance
        description: "The crowd at this week's game, home or away (bye weeks are filtered out in the model)"
        tests:
          - value_between:  # the 2000-2019 data runs 23,127 to 105,121
              arguments:
                min_value: 15000
                max_value: 110000

  - name: stg_kaggle_standings
    description: "Team performance metrics from Kaggle (2000-2019)"
    columns:
      - name: team_season_key
        description: "Primary key: team_year"
        tests:
          - unique
          - not_null

  - name: stg_kaggle_games
    description: "Regular-season game results from Kaggle (2000-2019): home team, away team, winner, tie"
    columns:
      - name: game_key
        description: "Primary key: year_week_hometeam"
        tests:
          - unique
          - not_null

  - name: stg_espn_games_core
    description: "Core game attributes from ESPN API (2020-2024)"
    columns:
      - name: game_id
        description: "ESPN game identifier"
        tests:
          - unique
          - not_null
      
      - name: attendance
        description: "Reported attendance. NULL = not reported by ESPN; 0 = no fans admitted (most of 2020)."
        tests:
          - not_null:
              config:
                severity: warn  # a few unreported games shouldn't stop the build, but should show
          - value_between:
              arguments:
                min_value: 0
                max_value: 110000

  - name: stg_espn_games_venue
    description: "Venue details from ESPN API (2020-2024)"
    columns:
      - name: game_id
        description: "ESPN game identifier"
        tests:
          - unique
          - not_null

  - name: stg_espn_games_time
    description: "Temporal attributes from ESPN API (2020-2024)"
    columns:
      - name: game_id
        description: "ESPN game identifier"
        tests:
          - unique
          - not_null

      - name: season_type
        description: "ESPN season type: 1 = preseason, 2 = regular season, 3 = postseason. The download keeps 2 only."
        tests:
          - accepted_values:
              arguments:
                values: [2]
                quote: false

  - name: stg_team_reference
    description: "Team identity mapping with relocation/rebrand tracking (from seed)"
    columns:
      - name: espn_team_id
        description: "ESPN team identifier"
        tests:
          - not_null

      - name: full_name
        description: "City + team name (e.g., 'Los Angeles Chargers')"
        tests:
          - not_null

      - name: active_years
        description: "Year range this team identity was active (e.g., '2017-2024' for LA Chargers)"
        tests:
          - not_null

gameday_analytics:
  target: dev
  outputs:
    dev:
      type: sqlite
      database: '../data/processed/nfl_attendance.db'
      schema: main
      schemas_and_paths:
        main: '../data/processed/nfl_attendance.db'
      threads: 1
      # dbt-sqlite attaches every *.db file in schema_directory as an extra schema,
      # so this points at a folder that stays empty (see sqlite_attach/README.md).
      # Pointing it at data/processed meant a backup copy of nfl_attendance.db
      # sitting there broke every dbt command with "malformed database schema".
      schema_directory: 'sqlite_attach'
    
    # Production deployment would use cloud data warehouse
    # Example for Snowflake:
    # prod:
    #   type: snowflake
    #   account: company_account
    #   user: "{{ env_var('DBT_USER') }}"
    #   password: "{{ env_var('DBT_PASSWORD') }}"
    #   role: transformer
    #   warehouse: transforming
    #   database: analytics
    #   schema: marts
    #   threads: 4
    
    # Example for BigQuery:
    # prod:
    #   type: bigquery
    #   method: service-account
    #   project: company-analytics
    #   dataset: marts
    #   threads: 4
    #   keyfile: /path/to/service-account.json
